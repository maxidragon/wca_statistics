name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USER: root
  DB_PASSWORD: password
  DB_NAME: wca_development

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 'password'
          MYSQL_DATABASE: wca_development
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -ppassword"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          echo "Disk usage after cleanup:"
          df -h /

      - name: Download and Import WCA Database Dump
        shell: bash
        run: |
          echo "Downloading database dump..."
          wget --quiet -O wca-developer-database-dump.zip \
            https://www.worldcubeassociation.org/wst/wca-developer-database-dump.zip

          # Stream the dump straight into MySQL so the ~10 GB .sql is never
          # written to the runner's disk.
          echo "Importing data to database ${DB_NAME}..."
          unzip -p wca-developer-database-dump.zip wca-developer-database-dump.sql \
            | mysql --host="${DB_HOST}" --port="${DB_PORT}" \
                    --user="${DB_USER}" --password="${DB_PASSWORD}" "${DB_NAME}"

          echo "Delete zip file..."
          rm -f wca-developer-database-dump.zip
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py
        run: |
          python main.py

      - name: Copy _config
        run: cp _config.yml output/_config.yml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          keep_files: true
          enable_jekyll: true
          allow_empty_commit: true
